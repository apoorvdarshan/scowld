# Dependabot version updates. Dependabot alerts are enabled separately in the
# repository settings; this file adds routine version bumps so pinned versions
# (the commit-SHA-pinned GitHub Actions, the store-release pin of the release
# workflows, and the scowld.xyz website's npm packages) do not go stale.
#
# What checks each weekly PR before it is merged:
#   github-actions  CodeQL, dependency review and web.yml run on every PR;
#                   ios-tests.yml and store-checks.yml run on the bumped
#                   workflow files they own. ios-release.yml runs only on tags and manual
#                   validation runs, so a bump to an action used only there is
#                   first exercised by the next validation run.
#   store-release   the pin in ios-release.yml and store-checks.yml (one SHA, with
#                   its "# vX.Y.Z" comment) gets a PR of its own; Store checks runs
#                   on it and fails unless both callers pin the same release.
#                   Before merging, run iOS Release -> Run workflow on its branch.
#   npm (/web)      web.yml runs lint, the Vitest suite, the site check and a
#                   smoke test that serves the site in the local Workers
#                   runtime. These are development tools only: the site is
#                   plain HTML, CSS and JavaScript with no runtime npm
#                   dependencies. Cloudflare Workers Builds deploys scowld-web
#                   from main commits that touch web/, so treat merging as
#                   deploying to scowld.xyz.
#
# Dependabot security updates are on in the repository settings, so the /web
# fixes for open alerts arrive as one grouped PR (web-security below).
#   swift (/ios)    ios-tests.yml builds and tests the app with the bumped
#                   Package.resolved (RevenueCat, for the tip jar).

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      # The release callers' pins (one SHA in both files, with its "# vX.Y.Z"
      # comment). Declared before the catch-all: a dependency joins the first group
      # it matches, so a store-release bump always gets its own PR.
      store-release:
        patterns: ["apoorvdarshan/store-release*"]
      github-actions:
        patterns: ["*"]
    # store-release pins run with the app's signing and App Store Connect
    # credentials: a new release waits seven days before Dependabot proposes it.
    # Security updates are never delayed by a cooldown.
    cooldown:
      default-days: 7
      include: ["apoorvdarshan/store-release*"]
    commit-message:
      prefix: "CI"

  # The store release tooling and its hash-locked Python dependencies live in
  # apoorvdarshan/store-release, which keeps them up to date; the store-release
  # group above moves this repository to each new release.

  # web/: the scowld.xyz website's development tools (Wrangler, ESLint,
  # html-validate, Vitest). Minor and patch updates share one weekly PR; a major
  # update gets a PR of its own, so a breaking major can never hold back a minor
  # or patch fix.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      web:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      web-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "Web"

  # ios/: Swift packages resolved in the Xcode project (RevenueCat).
  - package-ecosystem: swift
    directory: /ios
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      swift:
        patterns: ["*"]
    commit-message:
      prefix: "iOS"
