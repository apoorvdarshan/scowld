name: Feature request
description: Suggest an idea or enhancement for Scowld
title: "Feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. A clear problem statement helps more than a solution-only request.
        Check [existing issues](https://github.com/apoorvdarshan/scowld/issues) first to avoid duplicates.
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Live conversation and providers (Gemini Live, OpenAI Realtime, xAI Grok Voice)
        - Voices and hands-free wake mode
        - Avatar and character
        - Vision (camera)
        - Past chats
        - Settings
        - Website (scowld.xyz)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what gets in the way today?
      placeholder: I'm always frustrated when…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Scowld to do? Scowld keeps a bring-your-own-key model, with requests going straight from the device to your chosen provider.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried.
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, screenshots, related apps, or links are welcome.
