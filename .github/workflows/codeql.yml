# Static analysis (SAST) with GitHub CodeQL.
#
# Each job checks out only the directories its language lives in, so none of
# them downloads the marketing media. The bundled Amica/Arbius frontend
# (ios/Scowld/Resources/amica.bundle) is prebuilt, minified third-party
# JavaScript and is not analyzed.
#
#   javascript-typescript  web/ (scowld.xyz: static pages and a Cloudflare Worker)
#   python                 scripts/ (the test helpers in scripts/ci)
#   actions                .github/workflows/
#
# Swift (ios/) needs a macOS runner and a full app build, so it is analyzed by
# codeql-swift.yml weekly and for each release tag instead. A newer push to a
# pull request cancels its older analysis; main, scheduled and manual runs never
# are.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly on Mondays.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            sparse-checkout: |
              /web/
          - language: python
            sparse-checkout: |
              /scripts/
          - language: actions
            sparse-checkout: |
              /.github/
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ matrix.sparse-checkout }}
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
