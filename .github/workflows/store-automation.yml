# Offline checks of the iOS release automation. Never calls App Store Connect,
# never uploads, never edits the listing. Safe to run any time.
#
# This is where the committed listing, screenshots and release notes are fully
# validated on every pull request and main push that touches them. A tag release
# checks only the files its enabled switches use, so an unused file can never
# block a release. Uses the same pinned Python as the release workflow and
# installs the pinned App Store Connect CLI (asc) exactly as the release jobs do,
# so a pin whose download or SHA-256 no longer matches fails on the pull request
# instead of in a release. asc only reports its version here; nothing calls App
# Store Connect.

name: Store automation (offline)

on:
  pull_request:
    paths:
      - 'store/**'
      - 'scripts/store/**'
      - 'scripts/release_notes.py'
      - 'RELEASE_NOTES.md'
      - 'ios/Scowld.xcodeproj/project.pbxproj'
      - '.github/workflows/ios-release.yml'
      - '.github/workflows/store-automation.yml'
  push:
    branches: [main]
    paths:
      - 'store/**'
      - 'scripts/store/**'
      - 'scripts/release_notes.py'
      - 'RELEASE_NOTES.md'
      - 'ios/Scowld.xcodeproj/project.pbxproj'
      - '.github/workflows/ios-release.yml'
      - '.github/workflows/store-automation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-automation-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-checks:
    name: Release scripts (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /store/
            /RELEASE_NOTES.md
            /ios/Scowld.xcodeproj/

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Print iOS switches (must stay safe by default)
        env:
          IOS_RELEASE_AUTOMATION: ${{ vars.IOS_RELEASE_AUTOMATION }}
          IOS_CREATE_VERSION: ${{ vars.IOS_CREATE_VERSION }}
          IOS_UPLOAD_BUILD: ${{ vars.IOS_UPLOAD_BUILD }}
          IOS_UPLOAD_LISTING: ${{ vars.IOS_UPLOAD_LISTING }}
          IOS_UPLOAD_WHATS_NEW: ${{ vars.IOS_UPLOAD_WHATS_NEW }}
          IOS_UPLOAD_SCREENSHOTS: ${{ vars.IOS_UPLOAD_SCREENSHOTS }}
          IOS_UPLOAD_CREATIVE_ASSETS: ${{ vars.IOS_UPLOAD_CREATIVE_ASSETS }}
          IOS_SUBMIT_REVIEW: ${{ vars.IOS_SUBMIT_REVIEW }}
          IOS_PUBLIC_RELEASE: ${{ vars.IOS_PUBLIC_RELEASE }}
        run: python3 scripts/store/print_gates.py

      # Proves the pinned release still downloads and matches its checksum.
      - name: Install and check the pinned App Store Connect CLI (no store calls)
        run: |
          python3 scripts/store/asc_cli.py install --dest "$RUNNER_TEMP/asc-bin"
          PATH="$RUNNER_TEMP/asc-bin:$PATH" python3 scripts/store/asc_cli.py check

      - name: Test switches, tag check, build wait, asc runner, listing, screenshots, creative assets, submission, release notes and log redaction (offline)
        run: python3 -m unittest -v scripts/store/test_ios_release.py

      - name: Validate the committed listing and screenshots (no network)
        env:
          UPLOAD_LISTING: "true"
          UPLOAD_WHATS_NEW: "true"
          UPLOAD_SCREENSHOTS: "true"
        run: python3 scripts/store/asc_release.py --dry-run
