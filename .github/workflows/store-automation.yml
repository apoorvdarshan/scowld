# Offline checks of the iOS release automation. Never calls App Store Connect,
# never uploads, never edits the listing. Safe to run any time.
#
# This is where the committed listing, screenshots, header and search results
# images and release notes are fully validated on every pull request and main
# push that touches them. A tag release checks only the files its enabled
# switches use, so an unused file can never block a release. Uses the same pinned
# Python as the release workflow and installs the hash-locked store tooling
# exactly as the release jobs do, then signs a throwaway App Store Connect token
# and stages RGB screenshot copies with it (PyJWT, Pillow), so a Dependabot update
# to requirements-store.* is proven here instead of in a release.

name: Store automation (offline)

on:
  pull_request:
    paths:
      - 'store/**'
      - 'scripts/store/**'
      - 'scripts/release_notes.py'
      - 'RELEASE_NOTES.md'
      - 'requirements-store.*'
      - 'ios/Scowld.xcodeproj/project.pbxproj'
      - '.github/workflows/ios-release.yml'
      - '.github/workflows/store-automation.yml'
  push:
    branches: [main]
    paths:
      - 'store/**'
      - 'scripts/store/**'
      - 'scripts/release_notes.py'
      - 'RELEASE_NOTES.md'
      - 'requirements-store.*'
      - 'ios/Scowld.xcodeproj/project.pbxproj'
      - '.github/workflows/ios-release.yml'
      - '.github/workflows/store-automation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-automation-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-checks:
    name: Release scripts (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /store/
            /RELEASE_NOTES.md
            /requirements-store.*
            /ios/Scowld.xcodeproj/

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Print iOS switches (must stay safe by default)
        env:
          IOS_RELEASE_AUTOMATION: ${{ vars.IOS_RELEASE_AUTOMATION }}
          IOS_CREATE_VERSION: ${{ vars.IOS_CREATE_VERSION }}
          IOS_UPLOAD_BUILD: ${{ vars.IOS_UPLOAD_BUILD }}
          IOS_UPLOAD_LISTING: ${{ vars.IOS_UPLOAD_LISTING }}
          IOS_UPLOAD_WHATS_NEW: ${{ vars.IOS_UPLOAD_WHATS_NEW }}
          IOS_UPLOAD_SCREENSHOTS: ${{ vars.IOS_UPLOAD_SCREENSHOTS }}
          IOS_UPLOAD_CREATIVE_ASSETS: ${{ vars.IOS_UPLOAD_CREATIVE_ASSETS }}
          IOS_SUBMIT_REVIEW: ${{ vars.IOS_SUBMIT_REVIEW }}
          IOS_PUBLIC_RELEASE: ${{ vars.IOS_PUBLIC_RELEASE }}
        run: python3 scripts/store/print_gates.py

      - name: Install the hash-locked store tooling (as the release jobs do)
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r requirements-store.txt

      - name: Test switches, tag check, build wait, token, listing, screenshots, creative assets, submission, release notes and log redaction (offline)
        env:
          # The App Store Connect token test and the RGB screenshot tests use the
          # tooling installed above (PyJWT, Pillow) and must fail, never skip, if
          # it is missing.
          REQUIRE_STORE_TOOLING: "true"
        run: python3 -m unittest -v scripts/store/test_ios_release.py

      # Stages the screenshots as RGB copies, as a release does. The header and
      # search results images in store/creative/ios are checked by the tests above
      # (none is committed yet, so UPLOAD_CREATIVE_ASSETS=true would fail here).
      - name: Validate the committed listing and screenshots (no network)
        env:
          UPLOAD_LISTING: "true"
          UPLOAD_WHATS_NEW: "true"
          UPLOAD_SCREENSHOTS: "true"
        run: python3 scripts/store/asc_release.py --dry-run
