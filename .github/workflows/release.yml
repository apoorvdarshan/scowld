name: Release

# Publish a GitHub Release automatically whenever a version tag (v*) is pushed.
# This is the GitHub "Releases" entry — separate from the App Store build that
# Xcode Cloud produces from the same tag.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - name: Derive version (strip leading "v")
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Scowld ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          make_latest: "true"
